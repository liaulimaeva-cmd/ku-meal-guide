<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KU MEAL GUIDE - Korea University</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgundy: { DEFAULT: '#8C183A', dark: '#6A1228', light: '#A61C38' },
                        gold: '#C6A15B',
                        cream: '#F8F3E9',
                        beige: '#E8DCC8',
                        darkbrown: '#332A27'
                    }
                }
            }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #F8F3E9; color: #332A27; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-cream text-darkbrown min-h-screen flex flex-col">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_CAFETERIAS = [
            { 
                id: 'c1', 
                name: 'Student Union Cafeteria', 
                koName: '학생회관 학생식당', 
                location: 'Student Union Building 2F, Humanities & Social Sciences Campus', 
                hours: 'Breakfast: 08:00 - 09:30 | Lunch: 11:20 - 14:00 | Dinner: Closed',
                phone: '070-4242-1815'
            },
            { 
                id: 'c2', 
                name: 'Anam Dormitory Cafeteria', 
                koName: '안암학사 식당', 
                location: 'Anam Dormitory Administration Building 2F', 
                hours: 'Cheonwon Breakfast: 08:00 - 09:30 | Easy Meal: 08:00 - 19:00 | Lunch: 11:30 - 14:00 | Dinner: 17:00 - 19:00',
                phone: '070-4120-3229'
            },
            { 
                id: 'c3', 
                name: 'Sanhakwan Dining Hall', 
                koName: '산학관 식당', 
                location: 'Sanhakwan 1F, Science & Technology Campus', 
                hours: 'Lunch: 11:20 - 13:50 | Dinner: 17:30 - 18:50 (Last Order 18:30)',
                phone: '02-921-5770'
            },
            { 
                id: 'c4', 
                name: 'Science Campus Student Cafeteria', 
                koName: '자연계 학생식당', 
                location: 'Agineung Living Hall 2F', 
                hours: 'Cafe: 08:00 - 17:00 | Student Cafeteria - Breakfast: 08:00 - 09:30 / Lunch: 11:00 - 13:30 | Staff Cafeteria - Lunch: 11:00 - 14:00 / Dinner: 17:30 - 19:00',
                phone: '02-3290-4351'
            }
        ];

        const COMMON_ALLERGENS = [
            'Eggs', 'Milk', 'Peanuts', 'Tree Nuts', 'Soy', 'Wheat / Gluten', 
            'Fish', 'Shellfish', 'Pork', 'Beef', 'Chicken', 'Sesame'
        ];

        const DAYS_OF_WEEK = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        const getDayName = (dateStr) => {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d);
            return dateObj.toLocaleDateString('en-US', { weekday: 'long' });
        };

        const SUPABASE_URL = 'https://fzdseiswlhckroaliizn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1ShB7yCEJTtL3uWYzNZElQ_XSN-EPVO';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [view, setView] = useState('home');
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('ku_cloud_user') || 'null'));
            const [dishes, setDishes] = useState([]);
            
            // Модальное окно деталей блюда
            const [selectedDishModal, setSelectedDishModal] = useState(null);
            // Выбранная столовая во вкладке Cafeterias
            const [selectedCafeteriaId, setSelectedCafeteriaId] = useState(null);

            useEffect(() => {
                fetchDishes();
            }, []);

            const fetchDishes = async () => {
                const { data, error } = await supabase.from('dishes').select('*');
                if (error) {
                    console.error('Error fetching dishes:', error);
                } else if (data) {
                    setDishes(data);
                }
            };

            const [authForm, setAuthForm] = useState({ 
                username: '', 
                password: '', 
                email: '', 
                selectedAllergens: [], 
                otherAllergens: '' 
            });
            const [authError, setAuthError] = useState('');

            // Фильтры меню
            const [weeklyCafFilter, setWeeklyCafFilter] = useState('all');
            const [dayFilter, setDayFilter] = useState('all');
            const [mealFilter, setMealFilter] = useState('all');
            const [allergenFilter, setAllergenFilter] = useState('all'); // 'all' | 'safe_for_me' | конкретный аллерген

            // Полная форма администратора
            const [adminForm, setAdminForm] = useState({
                cafeteriaId: 'c1',
                date: new Date().toISOString().split('T')[0],
                mealType: 'Lunch',
                koName: '',
                enName: '',
                price: '',
                desc: '',
                ingredients: '',
                allergens: '',
                spice: 'Mild'
            });

            const [bulkText, setBulkText] = useState('');

            // Профиль студента для аллергий
            const [studentProfile, setStudentProfile] = useState(() => {
                return user?.profile || { allergens: [], spicePreference: 'Medium' };
            });
            const [profileOtherAllergen, setProfileOtherAllergen] = useState('');

            useEffect(() => { 
                localStorage.setItem('ku_cloud_user', JSON.stringify(user)); 
                if (user?.profile) {
                    setStudentProfile(user.profile);
                    const custom = (user.profile.allergens || []).filter(
                        a => !COMMON_ALLERGENS.some(ca => ca.toLowerCase() === a.toLowerCase())
                    );
                    setProfileOtherAllergen(custom.join(', '));
                }
            }, [user]);

            const switchView = (v) => { 
                setAuthError(''); 
                setView(v); 
            };

            const toggleSignupAllergen = (item) => {
                setAuthForm(prev => {
                    const exists = prev.selectedAllergens.includes(item);
                    return {
                        ...prev,
                        selectedAllergens: exists 
                            ? prev.selectedAllergens.filter(a => a !== item)
                            : [...prev.selectedAllergens, item]
                    };
                });
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (view === 'admin-login') {
                    if (authForm.username === 'KUmealAdmin' && authForm.password === 'KUAdmin!2026_MealGuide#47') {
                        setUser({ username: 'KUmealAdmin', role: 'admin' });
                        switchView('admin-dashboard');
                    } else {
                        setAuthError('Invalid admin credentials.');
                    }
                    return;
                }

                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .or(`username.eq.${authForm.username},email.eq.${authForm.username}`);

                if (error || !data || data.length === 0) {
                    setAuthError('User not found. Please sign up first.');
                    return;
                }

                const foundUser = data[0];
                if (foundUser.password !== authForm.password) {
                    setAuthError('Incorrect password.');
                    return;
                }

                setUser({ 
                    username: foundUser.username, 
                    email: foundUser.email, 
                    role: 'user', 
                    profile: foundUser.profile || { allergens: [] } 
                });
                switchView('home');
            };

            const handleSignup = async (e) => {
                e.preventDefault();
                if (!authForm.username || !authForm.email || !authForm.password) {
                    setAuthError('Fill in all required fields.');
                    return;
                }

                const { data: existing } = await supabase
                    .from('users')
                    .select('*')
                    .eq('username', authForm.username);

                if (existing && existing.length > 0) {
                    setAuthError('Username already taken. Choose another.');
                    return;
                }

                const customList = authForm.otherAllergens
                    ? authForm.otherAllergens.split(',').map(s => s.trim()).filter(Boolean)
                    : [];
                const combinedAllergens = Array.from(new Set([...authForm.selectedAllergens, ...customList]));

                const newProfile = { allergens: combinedAllergens, spicePreference: 'Medium' };
                const newUserRecord = {
                    username: authForm.username,
                    email: authForm.email,
                    password: authForm.password,
                    profile: newProfile
                };

                const { error } = await supabase.from('users').insert([newUserRecord]);
                if (error) {
                    setAuthError('Registration error: ' + error.message);
                    return;
                }

                setUser({ username: authForm.username, email: authForm.email, role: 'user', profile: newProfile });
                setAuthForm({ username: '', password: '', email: '', selectedAllergens: [], otherAllergens: '' });
                alert('Account successfully created and saved to cloud!');
                switchView('home');
            };

            const toggleProfileCommonAllergen = (item) => {
                setStudentProfile(prev => {
                    const current = prev.allergens || [];
                    const exists = current.some(a => a.toLowerCase() === item.toLowerCase());
                    return {
                        ...prev,
                        allergens: exists
                            ? current.filter(a => a.toLowerCase() !== item.toLowerCase())
                            : [...current, item]
                    };
                });
            };

            const handleUpdateProfile = async (e) => {
                e.preventDefault();
                const baseCommon = (studentProfile.allergens || []).filter(
                    a => COMMON_ALLERGENS.some(ca => ca.toLowerCase() === a.toLowerCase())
                );
                const customList = profileOtherAllergen
                    ? profileOtherAllergen.split(',').map(s => s.trim()).filter(Boolean)
                    : [];
                const mergedAllergens = Array.from(new Set([...baseCommon, ...customList]));

                const updatedProfile = { ...studentProfile, allergens: mergedAllergens };
                const updatedUser = { ...user, profile: updatedProfile };
                
                const { error } = await supabase
                    .from('users')
                    .update({ profile: updatedProfile })
                    .eq('username', user.username);

                if (error) {
                    alert('Error updating profile: ' + error.message);
                } else {
                    setStudentProfile(updatedProfile);
                    setUser(updatedUser);
                    alert('Profile and allergies updated successfully!');
                }
            };

            const handleAddDish = async (e) => {
                e.preventDefault();
                if (!adminForm.koName || !adminForm.enName || !adminForm.price) {
                    alert('Fill in Korean name, English name, and Price.');
                    return;
                }
                const newDish = {
                    id: 'dish_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
                    ...adminForm,
                    price: Number(adminForm.price),
                    allergens: adminForm.allergens ? adminForm.allergens.split(',').map(s => s.trim().toLowerCase()) : [],
                    published: true
                };

                const { error } = await supabase.from('dishes').insert([newDish]);
                if (error) {
                    alert('Error saving to cloud: ' + error.message);
                } else {
                    setDishes([...dishes, newDish]);
                    alert('Menu item published and saved to cloud!');
                    setAdminForm({ ...adminForm, koName: '', enName: '', price: '', desc: '', ingredients: '', allergens: '' });
                }
            };

            const handleBulkImport = async (e) => {
                e.preventDefault();
                if (!bulkText.trim()) {
                    alert('Please enter text to parse.');
                    return;
                }

                const lines = bulkText.split('\n');
                const newDishes = [];

                for (let line of lines) {
                    if (!line.trim()) continue;
                    const parts = line.split('|').map(p => p.trim());
                    if (parts.length >= 6) {
                        newDishes.push({
                            id: 'dish_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
                            date: parts[0],
                            cafeteriaId: parts[1],
                            mealType: parts[2],
                            koName: parts[3],
                            enName: parts[4],
                            price: Number(parts[5]) || 5000,
                            desc: parts[6] || '',
                            ingredients: parts[7] || '',
                            allergens: parts[8] ? parts[8].split(',').map(s => s.trim().toLowerCase()) : [],
                            published: true
                        });
                    }
                }

                if (newDishes.length === 0) {
                    alert('No valid rows found. Format: Date | CafId | Meal | KoName | EnName | Price | Desc | Ingredients | Allergens');
                    return;
                }

                const { error } = await supabase.from('dishes').insert(newDishes);
                if (error) {
                    alert('Error bulk uploading: ' + error.message);
                } else {
                    setDishes([...dishes, ...newDishes]);
                    alert(`Successfully parsed and uploaded ${newDishes.length} dishes to cloud!`);
                    setBulkText('');
                }
            };

            const handleDeleteDish = async (id) => {
                if (confirm('Are you sure you want to delete this menu item?')) {
                    const { error } = await supabase.from('dishes').delete().eq('id', id);
                    if (error) alert('Error deleting: ' + error.message);
                    else setDishes(dishes.filter(d => d.id !== id));
                }
            };

            const handleClearAllDishes = async () => {
                if (confirm('Are you sure you want to delete ALL published menus?')) {
                    const { error } = await supabase.from('dishes').delete().neq('id', '');
                    if (error) alert('Error: ' + error.message);
                    else setDishes([]);
                }
            };

            const todayStr = new Date().toISOString().split('T')[0];

            // Проверка совпадения аллергенов блюда с аллергенами студента
            const getMatchingUserAllergens = (dishAllergens) => {
                if (!user || !user.profile || !user.profile.allergens || !Array.isArray(dishAllergens)) return [];
                const userAllergensLower = user.profile.allergens.map(al => al.trim().toLowerCase());
                return dishAllergens.filter(a => {
                    const dishAl = a.trim().toLowerCase();
                    return userAllergensLower.some(uAl => uAl.includes(dishAl) || dishAl.includes(uAl));
                });
            };

            const checkAllergy = (dishAllergens) => getMatchingUserAllergens(dishAllergens).length > 0;

            // Общая функция фильтрации блюд по дню недели, приему пищи и аллергенам
            const matchesDishFilters = (dish, { includeDay = true } = {}) => {
                if (includeDay && dayFilter !== 'all') {
                    if (getDayName(dish.date) !== dayFilter) return false;
                }
                if (mealFilter !== 'all') {
                    if ((dish.mealType || '').toLowerCase() !== mealFilter.toLowerCase()) return false;
                }
                if (allergenFilter !== 'all') {
                    const dishAllergens = Array.isArray(dish.allergens) ? dish.allergens.map(a => a.toLowerCase()) : [];
                    if (allergenFilter === 'safe_for_me') {
                        if (checkAllergy(dish.allergens)) return false;
                    } else if (allergenFilter.startsWith('exclude:')) {
                        const target = allergenFilter.replace('exclude:', '').toLowerCase();
                        if (dishAllergens.some(a => a.includes(target) || target.includes(a))) return false;
                    }
                }
                return true;
            };

            const resetFilters = () => {
                setWeeklyCafFilter('all');
                setDayFilter('all');
                setMealFilter('all');
                setAllergenFilter('all');
            };

            const selectedCafeteriaObj = INITIAL_CAFETERIAS.find(c => c.id === selectedCafeteriaId);

            return (
                <div className="flex flex-col min-h-screen">
                    <header className="bg-burgundy text-white shadow-md sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
                            <div className="cursor-pointer font-bold text-lg" onClick={() => switchView('home')}>
                                🐯 KU MEAL GUIDE
                            </div>
                            
                            <nav className="flex flex-wrap items-center justify-center gap-2 text-sm font-medium">
                                <button onClick={() => switchView('home')} className={`px-3 py-1 rounded transition ${view === 'home' ? 'bg-gold text-darkbrown font-bold' : 'hover:bg-burgundy-dark'}`}>Home</button>
                                <button onClick={() => { setSelectedCafeteriaId(null); switchView('cafeterias'); }} className={`px-3 py-1 rounded transition ${view === 'cafeterias' ? 'bg-gold text-darkbrown font-bold' : 'hover:bg-burgundy-dark'}`}>Cafeterias</button>
                                <button onClick={() => switchView('todays-menu')} className={`px-3 py-1 rounded transition ${view === 'todays-menu' ? 'bg-gold text-darkbrown font-bold' : 'hover:bg-burgundy-dark'}`}>Today’s Menu</button>
                                <button onClick={() => switchView('weekly-menu')} className={`px-3 py-1 rounded transition ${view === 'weekly-menu' ? 'bg-gold text-darkbrown font-bold' : 'hover:bg-burgundy-dark'}`}>Weekly Menu</button>
                            </nav>

                            <div className="flex items-center gap-3">
                                {user ? (
                                    <>
                                        <span className="text-xs">Hi, {user.username}</span>
                                        {user.role === 'admin' ? (
                                            <button onClick={() => switchView('admin-dashboard')} className="bg-gold text-darkbrown px-2 py-1 rounded text-xs font-semibold">Admin</button>
                                        ) : (
                                            <button onClick={() => switchView('profile')} className="bg-gold text-darkbrown px-2 py-1 rounded text-xs font-semibold">Profile & Allergies</button>
                                        )}
                                        <button onClick={() => { setUser(null); switchView('home'); }} className="text-xs underline">Logout</button>
                                    </>
                                ) : (
                                    <>
                                        <button onClick={() => switchView('login')} className="text-xs">Login</button>
                                        <button onClick={() => switchView('signup')} className="bg-gold text-darkbrown px-2 py-1 rounded text-xs font-semibold">Sign Up</button>
                                        <button onClick={() => switchView('admin-login')} className="text-[10px] opacity-75">Admin</button>
                                    </>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow max-w-6xl w-full mx-auto px-4 py-6">
                        {view === 'home' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-lg shadow border border-beige text-center">
                                    <h1 className="text-2xl font-bold mb-2 text-burgundy">Welcome to Korea University Campus Meals</h1>
                                    <p className="text-gray-600 mb-4">Your ultimate guide to campus dining halls, daily menus, and weekly schedules.</p>
                                    <div className="flex justify-center gap-3 flex-wrap">
                                        <button onClick={() => switchView('todays-menu')} className="bg-burgundy text-white px-4 py-2 rounded text-sm font-semibold">View Today’s Menu</button>
                                        <button onClick={() => { setSelectedCafeteriaId(null); switchView('cafeterias'); }} className="bg-gold text-darkbrown px-4 py-2 rounded text-sm font-semibold">View Cafeterias & Hours</button>
                                        <button onClick={() => switchView('weekly-menu')} className="border border-burgundy text-burgundy px-4 py-2 rounded text-sm font-semibold hover:bg-cream">Weekly Menu</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* CAFETERIAS VIEW + МЕНЮ ПО ДНЯМ НЕДЕЛИ ПРИ НАЖАТИИ */}
                        {view === 'cafeterias' && (
                            <div className="space-y-4">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                    <h1 className="text-2xl font-bold text-burgundy">Campus Cafeterias & Operating Hours</h1>
                                    {selectedCafeteriaObj && (
                                        <button 
                                            onClick={() => setSelectedCafeteriaId(null)} 
                                            className="text-xs bg-beige hover:bg-gold text-darkbrown font-semibold px-3 py-1.5 rounded transition"
                                        >
                                            ← Back to All Cafeterias
                                        </button>
                                    )}
                                </div>

                                {!selectedCafeteriaObj ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {INITIAL_CAFETERIAS.map(caf => {
                                            const cafDishCount = dishes.filter(d => d.cafeteriaId === caf.id).length;
                                            return (
                                                <div 
                                                    key={caf.id} 
                                                    onClick={() => setSelectedCafeteriaId(caf.id)}
                                                    className="bg-white p-5 rounded-lg shadow border border-beige hover:border-burgundy hover:shadow-md transition cursor-pointer space-y-2 flex flex-col justify-between"
                                                >
                                                    <div className="space-y-2">
                                                        <div className="flex justify-between items-start gap-2">
                                                            <h2 className="font-bold text-lg text-burgundy">{caf.name} <span className="text-xs text-gray-500">({caf.koName})</span></h2>
                                                            <span className="text-xs bg-cream border border-beige text-burgundy font-semibold px-2 py-0.5 rounded whitespace-nowrap">
                                                                {cafDishCount} items
                                                            </span>
                                                        </div>
                                                        <p className="text-sm text-gray-700">📍 <strong>Location:</strong> {caf.location}</p>
                                                        <p className="text-sm text-gray-700">🕒 <strong>Hours:</strong> {caf.hours}</p>
                                                        <p className="text-sm text-gray-700">📞 <strong>Phone:</strong> {caf.phone}</p>
                                                    </div>
                                                    <div className="pt-2 border-t border-cream flex justify-end">
                                                        <span className="text-xs font-bold text-burgundy">Click to view menu by days of week →</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="bg-white p-5 rounded-lg shadow border border-burgundy space-y-1">
                                            <h2 className="font-bold text-xl text-burgundy">{selectedCafeteriaObj.name} <span className="text-sm text-gray-500">({selectedCafeteriaObj.koName})</span></h2>
                                            <p className="text-sm text-gray-700">📍 {selectedCafeteriaObj.location}</p>
                                            <p className="text-sm text-gray-700">🕒 {selectedCafeteriaObj.hours}</p>
                                            <p className="text-sm text-gray-700">📞 {selectedCafeteriaObj.phone}</p>
                                        </div>

                                        {/* Фильтр по приему пищи и аллергенам внутри столовой */}
                                        <div className="bg-white p-3 rounded-lg shadow border border-beige flex flex-wrap items-center gap-3">
                                            <span className="text-xs font-bold text-burgundy uppercase">Filter:</span>
                                            <select value={mealFilter} onChange={e => setMealFilter(e.target.value)} className="border rounded p-1.5 text-xs bg-white">
                                                <option value="all">All Meals</option>
                                                <option value="Breakfast">Breakfast</option>
                                                <option value="Lunch">Lunch</option>
                                                <option value="Dinner">Dinner</option>
                                            </select>
                                            <select value={allergenFilter} onChange={e => setAllergenFilter(e.target.value)} className="border rounded p-1.5 text-xs bg-white">
                                                <option value="all">All Allergens (Show All)</option>
                                                {user && user.profile?.allergens?.length > 0 && (
                                                    <option value="safe_for_me">✅ Hide My Allergens</option>
                                                )}
                                                {COMMON_ALLERGENS.map(al => (
                                                    <option key={al} value={`exclude:${al}`}>Exclude {al}</option>
                                                ))}
                                            </select>
                                        </div>

                                        {/* Меню выбранной столовой, сгруппированное по дням недели */}
                                        <div className="space-y-4">
                                            {DAYS_OF_WEEK.map(dayName => {
                                                const dayDishes = dishes
                                                    .filter(d => d.cafeteriaId === selectedCafeteriaObj.id && getDayName(d.date) === dayName)
                                                    .filter(d => matchesDishFilters(d, { includeDay: false }))
                                                    .sort((a, b) => new Date(a.date) - new Date(b.date));

                                                return (
                                                    <div key={dayName} className="bg-white p-4 rounded-lg shadow border border-beige">
                                                        <h3 className="font-bold text-burgundy border-b border-beige pb-1.5 mb-3 flex justify-between items-center">
                                                            <span>📅 {dayName}</span>
                                                            <span className="text-xs font-normal text-gray-500">{dayDishes.length} dish(es)</span>
                                                        </h3>
                                                        {dayDishes.length === 0 ? (

                            className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"
                            onClick={() => setSelectedDishModal(null)}
                        >
                            <div 
                                className="bg-white rounded-xl max-w-md w-full p-6 shadow-xl border-2 border-burgundy space-y-4"
                                onClick={e => e.stopPropagation()}
                            >
                                <div className="flex justify-between items-start gap-2 border-b border-beige pb-3">
                                    <div>
                                        <h3 className="text-xl font-bold text-burgundy">{selectedDishModal.koName}</h3>
                                        <p className="text-sm font-medium text-gray-700">{selectedDishModal.enName}</p>
                                    </div>
                                    <button 
                                        onClick={() => setSelectedDishModal(null)} 
                                        className="text-gray-400 hover:text-darkbrown font-bold text-lg px-2"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="space-y-2 text-sm">
                                    <div className="flex justify-between">
                                        <span className="text-gray-500">Cafeteria:</span>
                                        <span className="font-semibold">
                                            {INITIAL_CAFETERIAS.find(c => c.id === selectedDishModal.cafeteriaId)?.name || selectedDishModal.cafeteriaId}
                                        </span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-500">Date & Meal:</span>
                                        <span className="font-semibold">{selectedDishModal.date} ({getDayName(selectedDishModal.date)}) — {selectedDishModal.mealType}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-500">Price:</span>
                                        <span className="font-bold text-burgundy">{selectedDishModal.price} KRW</span>
                                    </div>
                                </div>

                                <div className="bg-cream p-3 rounded-lg border border-beige space-y-2 text-sm">
                                    <div>
                                        <span className="font-bold text-darkbrown block text-xs uppercase tracking-wide">Description</span>
                                        <p className="text-gray-700 mt-0.5">{selectedDishModal.desc || 'No detailed description provided.'}</p>
                                    </div>
                                    <div>
                                        <span className="font-bold text-darkbrown block text-xs uppercase tracking-wide">Ingredients</span>
                                        <p className="text-gray-700 mt-0.5">{selectedDishModal.ingredients || 'Not specified.'}</p>
                                    </div>
                                    <div>
                                        <span className="font-bold text-darkbrown block text-xs uppercase tracking-wide">Allergens</span>
                                        <p className="text-gray-700 mt-0.5">
                                            {selectedDishModal.allergens && selectedDishModal.allergens.length > 0 
                                                ? selectedDishModal.allergens.join(', ') 
                                                : 'None listed'}
                                        </p>
                                    </div>
                                </div>

                                {checkAllergy(selectedDishModal.allergens) ? (
                                    <div className="bg-red-100 border border-red-400 text-red-800 p-3 rounded text-xs font-semibold">
                                        ⚠️ Caution: This dish contains allergen(s) listed in your profile ({getMatchingUserAllergens(selectedDishModal.allergens).join(', ')}).
                                    </div>
                                ) : user && user.role !== 'admin' ? (
                                    <div className="bg-green-50 border border-green-300 text-green-800 p-2.5 rounded text-xs font-medium">
                                        ✅ Safe based on your registered allergen profile.
                                    </div>
                                ) : null}

                                <button 
                                    onClick={() => setSelectedDishModal(null)} 
                                    className="w-full bg-burgundy text-white py-2 rounded font-semibold text-sm"
                                >
                                    Close
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
