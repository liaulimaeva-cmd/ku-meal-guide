<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KU MEAL GUIDE - Korea University</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgundy: { DEFAULT: '#8C183A', dark: '#6A1228', light: '#A61C38' },
                        gold: '#C6A15B',
                        cream: '#F8F3E9',
                        beige: '#E8DCC8',
                        darkbrown: '#332A27'
                    }
                }
            }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #F8F3E9; color: #332A27; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-cream text-darkbrown min-h-screen flex flex-col">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_CAFETERIAS = [
            { 
                id: 'c4', 
                name: '산학관 식당 (Sanhakwan Dining Hall)', 
                koName: '산학관 식당', 
                location: 'Sanhakwan (Business School area)', 
                hours: 'Lunch: 11:30 - 13:30' 
            },
            { 
                id: 'c2', 
                name: '안암학사 식당 (Anam Dormitory Cafeteria)', 
                koName: '안암학사 식당', 
                location: 'Anam Dormitory', 
                hours: 'Breakfast: 08:00 - 09:30 | Lunch: 11:30 - 13:30 | Dinner: 17:30 - 19:00' 
            },
            { 
                id: 'c3', 
                name: '자연계 학생식당 (Science Campus Student Cafeteria)', 
                koName: '자연계 학생식당', 
                location: 'Science Campus ( Hana Science Hall )', 
                hours: 'Lunch: 11:30 - 13:30 | Dinner: 17:30 - 19:00' 
            },
            { 
                id: 'c1', 
                name: '학생회관 학생식당 (Student Union Cafeteria)', 
                koName: '학생회관 학생식당', 
                location: 'Student Union Building 2F', 
                hours: 'Lunch: 11:30 - 14:00 | Dinner: 17:00 - 19:00' 
            },
        ];

        // Инициализация Supabase
        const SUPABASE_URL = 'https://fzdseiswlhckroaliizn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1ShB7yCEJTtL3uWYzNZElQ_XSN-EPVO';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [view, setView] = useState('home');
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('ku_user') || 'null'));
            const [registeredUsers, setRegisteredUsers] = useState(() => JSON.parse(localStorage.getItem('ku_users') || '[]'));
            
            const [dishes, setDishes] = useState([]);
            
            useEffect(() => {
                fetchDishes();
            }, []);

            const fetchDishes = async () => {
                const { data, error } = await supabase.from('dishes').select('*');
                if (error) {
                    console.error('Error fetching dishes:', error);
                } else if (data) {
                    setDishes(data);
                }
            };

            const [authForm, setAuthForm] = useState({ username: '', password: '', email: '' });
            const [authError, setAuthError] = useState('');
            
            const [weeklyCafFilter, setWeeklyCafFilter] = useState('all');

            const [adminForm, setAdminForm] = useState({
                cafeteriaId: 'c1',
                date: new Date().toISOString().split('T')[0],
                mealType: 'Lunch',
                koName: '',
                enName: '',
                price: '',
                desc: '',
                ingredients: '',
                allergens: '',
                spice: 'Mild',
                imageUrl: ''
            });

            useEffect(() => { localStorage.setItem('ku_user', JSON.stringify(user)); }, [user]);
            useEffect(() => { localStorage.setItem('ku_users', JSON.stringify(registeredUsers)); }, [registeredUsers]);

            const switchView = (v) => { setAuthError(''); setView(v); };

            const handleLogin = (e) => {
                e.preventDefault();
                if (view === 'admin-login') {
                    if (authForm.username === 'KUmealAdmin' && authForm.password === 'KUAdmin!2026_MealGuide#47') {
                        setUser({ username: 'KUmealAdmin', role: 'admin' });
                        switchView('admin-dashboard');
                    } else {
                        setAuthError('Invalid admin credentials.');
                    }
                    return;
                }
                const found = registeredUsers.find(u => u.username.toLowerCase() === authForm.username.toLowerCase() || u.email.toLowerCase() === authForm.username.toLowerCase());
                if (!found || found.password !== authForm.password) {
                    setAuthError('Invalid username or password.');
                    return;
                }
                setUser({ username: found.username, email: found.email, role: 'user', profile: found.profile });
                switchView('home');
            };

            const handleSignup = (e) => {
                e.preventDefault();
                if (!authForm.username || !authForm.email || !authForm.password) {
                    setAuthError('Fill in all fields.');
                    return;
                }
                const exists = registeredUsers.some(u => u.username === authForm.username);
                if (exists) {
                    setAuthError('User already exists.');
                    return;
                }
                const newProfile = { allergies: [], dislikedFoods: [], spicePreference: 'Medium' };
                const newUser = { username: authForm.username, email: authForm.email, password: authForm.password, profile: newProfile };
                setRegisteredUsers([...registeredUsers, newUser]);
                setUser({ username: newUser.username, email: newUser.email, role: 'user', profile: newProfile });
                switchView('home');
            };

            const handleAddDish = async (e) => {
                e.preventDefault();
                if (!adminForm.koName || !adminForm.enName || !adminForm.price) {
                    alert('Fill in Korean name, English name, and Price.');
                    return;
                }
                const newDish = {
                    id: 'dish_' + Date.now(),
                    ...adminForm,
                    price: Number(adminForm.price),
                    allergens: adminForm.allergens ? adminForm.allergens.split(',').map(s => s.trim().toLowerCase()) : [],
                    published: true
                };

                const { error } = await supabase.from('dishes').insert([newDish]);
                if (error) {
                    alert('Error saving to cloud: ' + error.message);
                } else {
                    setDishes([...dishes, newDish]);
                    alert('Menu item published and saved to cloud!');
                    setAdminForm({ ...adminForm, koName: '', enName: '', price: '', desc: '', ingredients: '', allergens: '', imageUrl: '' });
                }
            };

            const handleDeleteDish = async (id) => {
                if (confirm('Are you sure you want to delete this menu item?')) {
                    const { error } = await supabase.from('dishes').delete().eq('id', id);
                    if (error) {
                        alert('Error deleting: ' + error.message);
                    } else {
                        setDishes(dishes.filter(d => d.id !== id));
                    }
                }
            };

            const handleClearAllDishes = async () => {
                if (confirm('Are you sure you want to delete ALL published menus?')) {
                    const { error } = await supabase.from('dishes').delete().neq('id', '');
                    if (error) {
                        alert('Error: ' + error.message);
                    } else {
                        setDishes([]);
                    }
                }
            };

            const todayStr = new Date().toISOString().split('T')[0];

            return (
                <div className="flex flex-col min-h-screen">
                    <header className="bg-burgundy text-white shadow-md sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
                            <div className="flex items-center justify-between w-full md:w-auto">
                                <div className="cursor-pointer font-bold text-lg" onClick={() => switchView('home')}>
                                    🐯 KU MEAL GUIDE
                                </div>
                            </div>
                            
                            {/* Навигация в нужном порядке */}
                            <nav className="flex flex-wrap items-center justify-center gap-2 text-sm font-medium">
                                <button onClick={() => switchView('home')} className={`px-3 py-1 rounded transition ${view === 'home' ? 'bg-gold text-darkbrown font-bold' : 'hover:bg-burgundy-dark'}`}>Home</button>
                                <button onClick={() => switchView('cafeterias')} className={`px-3 py-1 rounded transition ${view === 'cafeterias' ? 'bg-gold text-darkbrown font-bold' : 'hover:bg-burgundy-dark'}`}>Cafeterias</button>
                                <button onClick={() => switchView('todays-menu')} className={`px-3 py-1 rounded transition ${view === 'todays-menu' ? 'bg-gold text-darkbrown font-bold' : 'hover:bg-burgundy-dark'}`}>Today’s Menu</button>
                                <button onClick={() => switchView('weekly-menu')} className={`px-3 py-1 rounded transition ${view === 'weekly-menu' ? 'bg-gold text-darkbrown font-bold' : 'hover:bg-burgundy-dark'}`}>Weekly Menu</button>
                            </nav>

                            <div className="flex items-center gap-3">
                                {user ? (
                                    <>
                                        <span className="text-xs">Hi, {user.username}</span>
                                        {user.role === 'admin' ? (
                                            <button onClick={() => switchView('admin-dashboard')} className="bg-gold text-darkbrown px-2 py-1 rounded text-xs font-semibold">Admin</button>
                                        ) : (
                                            <button onClick={() => switchView('profile')} className="bg-gold text-darkbrown px-2 py-1 rounded text-xs font-semibold">Profile</button>
                                        )}
                                        <button onClick={() => { setUser(null); switchView('home'); }} className="text-xs underline">Logout</button>
                                    </>
                                ) : (
                                    <>
                                        <button onClick={() => switchView('login')} className="text-xs">Login</button>
                                        <button onClick={() => switchView('signup')} className="bg-gold text-darkbrown px-2 py-1 rounded text-xs font-semibold">Sign Up</button>
                                        <button onClick={() => switchView('admin-login')} className="text-[10px] opacity-75">Admin</button>
                                    </>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow max-w-6xl w-full mx-auto px-4 py-6">
                        {/* HOME VIEW */}
                        {view === 'home' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-lg shadow border border-beige text-center">
                                    <h1 className="text-2xl font-bold mb-2 text-burgundy">Welcome to Korea University Campus Meals</h1>
                                    <p className="text-gray-600 mb-4">Your ultimate guide to campus dining halls, daily menus, operating hours, and weekly schedules.</p>
                                    <div className="flex justify-center gap-3 flex-wrap">
                                        <button onClick={() => switchView('todays-menu')} className="bg-burgundy text-white px-4 py-2 rounded text-sm font-semibold">View Today’s Menu</button>
                                        <button onClick={() => switchView('cafeterias')} className="bg-gold text-darkbrown px-4 py-2 rounded text-sm font-semibold">View Cafeterias & Hours</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* CAFETERIAS VIEW (С адресами, временем и приемами пищи) */}
                        {view === 'cafeterias' && (
                            <div className="space-y-4">
                                <h1 className="text-2xl font-bold text-burgundy">Campus Cafeterias & Operating Hours</h1>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {INITIAL_CAFETERIAS.map(caf => (
                                        <div key={caf.id} className="bg-white p-5 rounded-lg shadow border border-beige space-y-2">
                                            <h2 className="font-bold text-lg text-burgundy">{caf.name}</h2>
                                            <p className="text-sm text-gray-700">📍 <strong>Location:</strong> {caf.location}</p>
                                            <p className="text-sm text-gray-700">🕒 <strong>Meal Times & Hours:</strong> {caf.hours}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TODAY'S MENU VIEW */}
                        {view === 'todays-menu' && (
                            <div className="space-y-4">
                                <h1 className="text-2xl font-bold text-burgundy">Today’s Menu ({todayStr})</h1>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {INITIAL_CAFETERIAS.map(caf => {
                                        const cafDishes = dishes.filter(d => d.cafeteriaId === caf.id && d.date === todayStr);
                                        return (
                                            <div key={caf.id} className="bg-white p-4 rounded-lg shadow border border-beige">
                                                <h2 className="font-bold text-burgundy">{caf.name}</h2>
                                                <p className="text-xs text-gray-500 mb-2">{caf.hours}</p>
                                                <div className="space-y-2 mt-2">
                                                    {cafDishes.length === 0 ? (
                                                        <p className="text-sm text-gray-400 italic">No menu published for today yet.</p>
                                                    ) : (
                                                        cafDishes.map(dish => (
                                                            <div key={dish.id} className="flex justify-between items-center border-b pb-1 text-sm">
                                                                <div>
                                                                    <span className="font-semibold">{dish.koName}</span> ({dish.enName})
                                                                    <span className="text-xs bg-beige px-1.5 py-0.5 rounded ml-1 text-burgundy font-bold">{dish.mealType}</span>
                                                                </div>
                                                                <div className="text-burgundy font-bold">{dish.price} KRW</div>
                                                            </div>
                                                        ))
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* WEEKLY MENU VIEW */}
                        {view === 'weekly-menu' && (
                            <div className="space-y-4">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-3">
                                    <h1 className="text-2xl font-bold text-burgundy">Weekly Menu Schedule</h1>
                                    <select value={weeklyCafFilter} onChange={e => setWeeklyCafFilter(e.target.value)} className="border rounded p-2 text-sm bg-white">
                                        <option value="all">All Cafeterias</option>
                                        {INITIAL_CAFETERIAS.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </div>

                                <div className="bg-white p-4 rounded-lg shadow border border-beige space-y-3">
                                    {dishes.length === 0 ? (
                                        <p className="text-sm text-gray-400 italic">No menu items available in the cloud yet.</p>
                                    ) : (
                                        dishes
                                            .filter(d => weeklyCafFilter === 'all' || d.cafeteriaId === weeklyCafFilter)
                                            .sort((a, b) => new Date(a.date) - new Date(b.date))
                                            .map(dish => {
                                                const caf = INITIAL_CAFETERIAS.find(c => c.id === dish.cafeteriaId);
                                                return (
                                                    <div key={dish.id} className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-2 text-sm gap-1">
                                                        <div>
                                                            <div className="font-bold text-burgundy">{dish.koName} ({dish.enName})</div>
                                                            <div className="text-xs text-gray-500">{caf ? caf.name : ''} | 📅 {dish.date} (<span className="font-semibold text-burgundy">{dish.mealType}</span>)</div>
                                                        </div>
                                                        <div className="font-bold text-burgundy">{dish.price} KRW</div>
                                                    </div>
                                                );
                                            })
                                    )}
                                </div>
                            </div>
                        )}

                        {/* AUTH VIEWS */}
                        {(view === 'login' || view === 'signup' || view === 'admin-login') && (
                            <div className="max-w-md mx-auto bg-white p-6 rounded-lg shadow border border-beige">
                                <h2 className="text-xl font-bold mb-4 text-burgundy">
                                    {view === 'admin-login' ? 'Admin Login' : view === 'login' ? 'Login' : 'Sign Up'}
                                </h2>
                                {authError && <div className="bg-red-100 text-red-700 p-2 rounded mb-3 text-sm">{authError}</div>}
                                <form onSubmit={view === 'signup' ? handleSignup : handleLogin} className="space-y-3">
                                    <div>
                                        <label className="block text-sm font-semibold mb-1">Username / Email</label>
                                        <input type="text" value={authForm.username} onChange={e => setAuthForm({...authForm, username: e.target.value})} className="w-full border rounded p-2 text-sm" required />
                                    </div>
                                    {view === 'signup' && (
                                        <div>
                                            <label className="block text-sm font-semibold mb-1">Email</label>
                                            <input type="email" value={authForm.email} onChange={e => setAuthForm({...authForm, email: e.target.value})} className="w-full border rounded p-2 text-sm" required />
                                        </div>
                                    )}
                                    <div>
                                        <label className="block text-sm font-semibold mb-1">Password</label>
                                        <input type="password" value={authForm.password} onChange={e => setAuthForm({...authForm, password: e.target.value})} className="w-full border rounded p-2 text-sm" required />
                                    </div>
                                    <button type="submit" className="w-full bg-burgundy text-white py-2 rounded font-semibold text-sm">
                                        {view === 'signup' ? 'Create Account' : 'Login'}
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* ADMIN DASHBOARD */}
                        {view === 'admin-dashboard' && user?.role === 'admin' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-bold text-burgundy">Admin Dashboard</h1>
                                <div className="bg-white p-6 rounded-lg shadow border border-beige">
                                    <h2 className="text-lg font-bold mb-3">Add New Dish</h2>
                                    <form onSubmit={handleAddDish} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-semibold mb-1">Cafeteria</label>
                                            <select value={adminForm.cafeteriaId} onChange={e => setAdminForm({...adminForm, cafeteriaId: e.target.value})} className="w-full border rounded p-2 text-sm">
                                                {INITIAL_CAFETERIAS.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-1">Date</label>
                                            <input type="date" value={adminForm.date} onChange={e => setAdminForm({...adminForm, date: e.target.value})} className="w-full border rounded p-2 text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-1">Meal Type (Breakfast / Lunch / Dinner)</label>
                                            <select value={adminForm.mealType} onChange={e => setAdminForm({...adminForm, mealType: e.target.value})} className="w-full border rounded p-2 text-sm">
                                                <option value="Lunch">Lunch</option>
                                                <option value="Dinner">Dinner</option>
                                                <option value="Breakfast">Breakfast</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-1">Korean Name</label>
                                            <input type="text" value={adminForm.koName} onChange={e => setAdminForm({...adminForm, koName: e.target.value})} className="w-full border rounded p-2 text-sm" placeholder="김치찌개" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-1">English Name</label>
                                            <input type="text" value={adminForm.enName} onChange={e => setAdminForm({...adminForm, enName: e.target.value})} className="w-full border rounded p-2 text-sm" placeholder="Kimchi Stew" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-1">Price (KRW)</label>
                                            <input type="number" value={adminForm.price} onChange={e => setAdminForm({...adminForm, price: e.target.value})} className="w-full border rounded p-2 text-sm" placeholder="5000" />
                                        </div>
                                        <div className="md:col-span-2">
                                            <button type="submit" className="bg-burgundy text-white px-4 py-2 rounded font-semibold text-sm">Publish to Cloud</button>
                                        </div>
                                    </form>
                                </div>

                                <div className="bg-white p-6 rounded-lg shadow border border-beige">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-lg font-bold">Published Dishes in Cloud ({dishes.length})</h2>
                                        {dishes.length > 0 && (
                                            <button onClick={handleClearAllDishes} className="bg-red-600 text-white px-3 py-1 rounded text-xs font-semibold">Delete All</button>
                                        )}
                                    </div>
                                    <div className="space-y-2 max-h-96 overflow-y-auto">
                                        {dishes.map(dish => (
                                            <div key={dish.id} className="flex justify-between items-center border-b p-2 text-sm">
                                                <div>
                                                    <span className="font-bold">{dish.koName}</span> ({dish.enName}) - <span className="text-burgundy">{dish.price} KRW</span> <span className="text-xs text-gray-500">[{dish.mealType}]</span>
                                                </div>
                                                <button onClick={() => handleDeleteDish(dish.id)} className="text-red-600 font-bold px-2 py-1 text-xs">Delete</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
