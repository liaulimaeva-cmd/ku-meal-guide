        const translateAllergen = (item, targetLang) => {
            if (!item) return '';
            if (Array.isArray(item)) {
                return item.map(subItem => translateAllergen(subItem, targetLang)).join(', ');
            }
            
            const clean = String(item).trim().toLowerCase();
            if (targetLang === 'en') return item.trim();
            
            if (ALLERGEN_TRANSLATIONS[clean]) {
                return ALLERGEN_TRANSLATIONS[clean][targetLang] || item.trim();
            }
            
            for (const [key, translations] of Object.entries(ALLERGEN_TRANSLATIONS)) {
                if (clean.includes(key)) {
                    return translations[targetLang] || item.trim();
                }
            }
            
            return item.trim();

            if (parts.length === 3) {

                const m = parts[1].padStart(2, '0');
                const d = parts[2].padStart(2, '0');
                return `${y}-${m}-${d}`;

            return clean;

                                    type="date" 
                                    value={selectedQuickDate} 
                                    onChange={e => setSelectedQuickDate(e.target.value)} 
                                    className="border border-beige rounded p-1.5 text-xs bg-cream text-darkbrown font-semibold focus:outline-none focus:border-burgundy cursor-pointer"
                                />
                                <button 
                                    onClick={() => setSelectedQuickDate(new Date().toISOString().split('T')[0])}
                                    className="text-xs bg-burgundy/10 hover:bg-burgundy text-burgundy hover:text-white px-2.5 py-1 rounded transition font-semibold"
                                >
                                    {lang === 'ru' ? 'Сегодня' : lang === 'zh' ? '今天' : 'Today'}
                                </button>
                            </div>
                        </div>

                        {filteredDishes.length === 0 ? (
                            <div className="bg-white rounded-lg shadow border border-beige p-8 text-center text-gray-400 italic text-sm">
                                {t.noMatchingDishes}
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {filteredDishes.map(d => renderDishCard(d))}
                            </div>
                        )}
                    </div>
                );
            };

            const renderWeeklyMenuView = () => {
                const cafes = getCafeterias(lang);
                const weekDates = getCurrWeekDates();

                const filteredDishes = dishes.filter(d => {
                    if (weeklyCafFilter !== 'all' && d.cafeteriaId !== weeklyCafFilter) return false;
                    if (dayFilter !== 'all' && getDayName(d.date) !== dayFilter) return false;
                    if (mealFilter !== 'all' && d.mealType !== mealFilter) return false;
                    if (allergenFilter !== 'all') {
                        const hasThisAllergen = (d.allergens || []).some(a => a.toLowerCase() === allergenFilter.toLowerCase());
                        if (hasThisAllergen) return false;
                    }
                    return true;
                });

                return (
                    <div className="max-w-7xl mx-auto px-4 py-8 flex-grow">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-darkbrown">{t.weeklyMenu}</h2>
                            {selectedCafeteriaId && (
                                <button onClick={() => setSelectedCafeteriaId(null)} className="text-xs text-burgundy font-bold hover:underline">
                                    {t.backToCafes}
                                </button>
                            )}
                        </div>

                        <div className="bg-white rounded-xl shadow border border-beige p-4 mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">{t.filterCafeteria}</label>
                                <select value={selectedCafeteriaId || weeklyCafFilter} onChange={e => { setSelectedCafeteriaId(null); setWeeklyCafFilter(e.target.value); }} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown font-semibold">
                                    <option value="all">{t.allCafeterias}</option>
                                    {cafes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">{t.filterDayOfWeek}</label>
                                <select value={dayFilter} onChange={e => setDayFilter(e.target.value)} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown font-semibold">
                                    <option value="all">{t.allDays}</option>
                                    {DAYS_OF_WEEK.map(day => <option key={day} value={day}>{translateDay(day, lang)}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">{t.filterMealType}</label>
                                <select value={mealFilter} onChange={e => setMealFilter(e.target.value)} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown font-semibold">
                                    <option value="all">{t.allMeals}</option>
                                    <option value="Breakfast">{t.breakfast}</option>
                                    <option value="Lunch">{t.lunch}</option>
                                    <option value="Dinner">{t.dinner}</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-600 mb-1">{t.filterAllergens}</label>
                                <select value={allergenFilter} onChange={e => setAllergenFilter(e.target.value)} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown font-semibold">
                                    <option value="all">{t.allAllergensShowAll}</option>
                                    {COMMON_ALLERGENS.map(al => <option key={al} value={al}>{t.excludeText} {translateAllergen(al, lang)}</option>)}
                                </select>
                            </div>
                        </div>

                        {selectedCafeteriaId ? (
                            <div className="space-y-6">
                                <div className="bg-burgundy/10 p-4 rounded-xl border border-burgundy/20">
                                    <h3 className="text-lg font-bold text-burgundy">{CAFETERIAS_DATA[selectedCafeteriaId]?.[lang]?.name}</h3>
                                    <p className="text-xs text-gray-600 mt-1">{CAFETERIAS_DATA[selectedCafeteriaId]?.[lang]?.location}</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-7 gap-4">
                                    {weekDates.map(dayObj => {
                                        const dayEnName = getDayName(dayObj.dateStr);
                                        const dayDishes = filteredDishes.filter(d => d.cafeteriaId === selectedCafeteriaId && d.date === dayObj.dateStr);
                                        const dayLocalized = translateDay(dayEnName, lang);
                                        return (
                                            <div key={dayObj.dateStr} className="bg-white rounded-lg shadow border border-beige p-3 flex flex-col">
                                                <div className="border-b border-beige pb-2 mb-2 text-center">
                                                    <div className="text-xs font-bold text-burgundy">{dayLocalized}</div>
                                                    <div className="text-xs text-gray-500">{dayObj.dateStr}</div>
                                                </div>
                                                <div className="space-y-2 flex-grow">
                                                    {dayDishes.length === 0 ? (
                                                        <p className="text-xs text-gray-400 italic text-center py-4">{t.noDishesForDay} {dayLocalized}.</p>
                                                    ) : (
                                                        dayDishes.map(d => (
                                                            <div key={d.id} onClick={() => setSelectedDishModal(d)} className="p-2 bg-cream rounded border border-beige/60 cursor-pointer hover:border-burgundy transition">
                                                                <div className="font-bold text-darkbrown text-xs truncate">{d.koName}</div>
                                                                <div className="text-[10px] text-gray-600 truncate">{getLocalizedField(d, 'Name', lang)}</div>
                                                                <div className="text-[10px] text-burgundy font-semibold mt-1 flex justify-between">
                                                                    <span>{d.mealType}</span>
                                                                    <span>{(!d.price || d.price === 0) ? t.priceUnknown : `${d.price} ${t.price}`}</span>
                                                                </div>
                                                            </div>
                                                        ))
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                {cafes.map(caf => {
                                    const cafDishes = filteredDishes.filter(d => d.cafeteriaId === caf.id);
                                    return (
                                        <div key={caf.id} className="bg-white rounded-xl shadow border border-beige p-4 flex flex-col justify-between">
                                            <div>
                                                <h3 className="font-bold text-burgundy text-base mb-1">{caf.name}</h3>
                                                <p className="text-xs text-gray-500 mb-4">{cafDishes.length} {t.dishCountLabel}</p>
                                                <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                                                    {cafDishes.map(d => (
                                                        <div key={d.id} onClick={() => setSelectedDishModal(d)} className="p-2 bg-cream rounded border border-beige cursor-pointer hover:border-burgundy transition">
                                                            <div className="text-xs font-bold text-darkbrown truncate">{d.koName}</div>
                                                            <div className="text-[10px] text-gray-600 truncate">{getLocalizedField(d, 'Name', lang)}</div>
                                                            <div className="text-[10px] text-burgundy font-semibold mt-1 flex justify-between">
                                                                <span>{d.date} ({d.mealType})</span>
                                                                <span>{(!d.price || d.price === 0) ? t.priceUnknown : `${d.price} ${t.price}`}</span>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <button onClick={() => setSelectedCafeteriaId(caf.id)} className="mt-4 w-full bg-burgundy/10 text-burgundy text-xs font-bold py-2 rounded hover:bg-burgundy hover:text-cream transition">
                                                {t.details} →
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                );
            };

            const renderProfileView = () => (
                <div className="max-w-xl mx-auto px-4 py-8 flex-grow">
                    <div className="bg-white rounded-xl shadow border border-beige p-6">
                        <h2 className="text-2xl font-bold text-darkbrown mb-4">{t.profile}</h2>
                        <form onSubmit={handleUpdateProfile} className="space-y-6">
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-2">{t.selectYourAllergens}</label>
                                <div className="grid grid-cols-2 gap-2">
                                    {COMMON_ALLERGENS.map(al => {
                                        const isChecked = (studentProfile.allergens || []).some(a => a.toLowerCase() === al.toLowerCase());
                                        return (
                                            <label key={al} className={`flex items-center gap-2 p-2 rounded border cursor-pointer text-xs ${isChecked ? 'bg-burgundy/10 border-burgundy font-bold text-burgundy' : 'bg-cream border-beige text-darkbrown'}`}>
                                                <input 
                                                    type="checkbox" 
                                                    checked={isChecked} 
                                                    onChange={() => toggleProfileCommonAllergen(al)} 
                                                    className="rounded border-beige text-burgundy focus:ring-burgundy"
                                                />
                                                {translateAllergen(al, lang)}
                                            </label>
                                        );
                                    })}
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-1">Other Allergens (comma separated)</label>
                                <input 
                                    type="text" 
                                    value={profileOtherAllergen} 
                                    onChange={e => setProfileOtherAllergen(e.target.value)} 
                                    placeholder="e.g. kiwi, buckwheat, garlic" 
                                    className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown"
                                />
                            </div>
                            <button type="submit" className="w-full bg-burgundy text-cream font-bold py-2.5 rounded text-xs hover:bg-burgundy-dark transition">
                                Save Profile
                            </button>
                        </form>
                    </div>
                </div>
            );

            const renderAdminDashboard = () => (
                <div className="max-w-7xl mx-auto px-4 py-8 flex-grow">
                    <h2 className="text-2xl font-bold text-darkbrown mb-6">Admin Dashboard</h2>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                        <div className="bg-white rounded-xl shadow border border-beige p-6">
                            <h3 className="text-lg font-bold text-burgundy mb-4">Add Single Dish</h3>
                            <form onSubmit={handleAddDish} className="space-y-4">
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Cafeteria</label>
                                        <select value={adminForm.cafeteriaId} onChange={e => setAdminForm({...adminForm, cafeteriaId: e.target.value})} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown">
                                            {getCafeterias(lang).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Date</label>
                                        <input type="date" value={adminForm.date} onChange={e => setAdminForm({...adminForm, date: e.target.value})} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Meal Type</label>
                                        <select value={adminForm.mealType} onChange={e => setAdminForm({...adminForm, mealType: e.target.value})} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown">
                                            <option value="Breakfast">Breakfast</option>
                                            <option value="Lunch">Lunch</option>
                                            <option value="Dinner">Dinner</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Price (optional)</label>
                                        <input type="number" value={adminForm.price} onChange={e => setAdminForm({...adminForm, price: e.target.value})} placeholder="e.g. 5000" className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 mb-1">Korean Name *</label>
                                    <input type="text" value={adminForm.koName} onChange={e => setAdminForm({...adminForm, koName: e.target.value})} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 mb-1">English Name *</label>
                                    <input type="text" value={adminForm.enName} onChange={e => setAdminForm({...adminForm, enName: e.target.value})} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown" />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Russian Name</label>
                                        <input type="text" value={adminForm.ruName} onChange={e => setAdminForm({...adminForm, ruName: e.target.value})} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Chinese Name</label>
                                        <input type="text" value={adminForm.zhName} onChange={e => setAdminForm({...adminForm, zhName: e.target.value})} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 mb-1">Allergens (comma separated)</label>
                                    <input type="text" value={adminForm.allergens} onChange={e => setAdminForm({...adminForm, allergens: e.target.value})} placeholder="pork, soy, wheat" className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown" />
                                </div>
                                <button type="submit" className="w-full bg-burgundy text-cream font-bold py-2 rounded text-xs hover:bg-burgundy-dark transition">
                                    Publish Dish
                                </button>
                            </form>
                        </div>

                        <div className="bg-white rounded-xl shadow border border-beige p-6">
                            <h3 className="text-lg font-bold text-burgundy mb-4">Bulk Import</h3>
                            <form onSubmit={handleBulkImport} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 mb-1">Paste Data (Format: Date|CafId|Meal|Ko|En|Ru|Zh|Price|...)</label>
                                    <textarea rows="10" value={bulkText} onChange={e => setBulkText(e.target.value)} placeholder="2026-11-18 | c1 | Lunch | 김치찌개 | Kimchi Stew | Кимчи чхиге | 泡菜汤 | 5000 | ..." className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown font-mono"></textarea>
                                </div>
                                <button type="submit" className="w-full bg-gold text-darkbrown font-bold py-2 rounded text-xs hover:bg-gold/90 transition">
                                    Import Bulk Data
                                </button>
                            </form>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow border border-beige p-6">
                        <h3 className="text-lg font-bold text-burgundy mb-4">Manage Published Dishes ({dishes.length})</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-xs text-left">
                                <thead className="bg-cream border-b border-beige text-darkbrown">
                                    <tr>
                                        <th className="p-2">Date</th>
                                        <th className="p-2">Cafeteria</th>
                                        <th className="p-2">Meal</th>
                                        <th className="p-2">Korean Name</th>
                                        <th className="p-2">English Name</th>
                                        <th className="p-2">Price</th>
                                        <th className="p-2 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {dishes.map(d => (
                                        <tr key={d.id} className="border-b border-beige/40 hover:bg-cream/40">
                                            <td className="p-2">{d.date}</td>
                                            <td className="p-2">{CAFETERIAS_DATA[d.cafeteriaId]?.en?.name}</td>
                                            <td className="p-2">{d.mealType}</td>
                                            <td className="p-2 font-bold">{d.koName}</td>
                                            <td className="p-2">{d.enName}</td>
                                            <td className="p-2">{(!d.price || d.price === 0) ? 'Unknown' : `${d.price} KRW`}</td>
                                            <td className="p-2 text-right">
                                                <button onClick={() => handleDeleteDish(d.id)} className="bg-red-100 text-red-600 px-2 py-1 rounded font-semibold hover:bg-red-200 transition">Delete</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            const renderAuth = () => (
                <div className="max-w-md mx-auto px-4 py-16 flex-grow">
                    <div className="bg-white rounded-xl shadow border border-beige p-8">
                        <h2 className="text-2xl font-bold text-darkbrown mb-6 text-center">
                            {view === 'login' ? t.login : view === 'signup' ? t.signup : 'Admin Login'}
                        </h2>
                        {authError && <div className="mb-4 p-3 bg-red-50 border border-red-300 rounded text-xs text-red-600 font-semibold">{authError}</div>}
                        <form onSubmit={view === 'signup' ? handleSignup : handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-1">{view === 'admin-login' ? 'Admin Username' : 'Username or Email'}</label>
                                <input type="text" value={authForm.username} onChange={e => setAuthForm({...authForm, username: e.target.value})} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown" required />
                            </div>
                            {view === 'signup' && (
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 mb-1">Email</label>
                                    <input type="email" value={authForm.email} onChange={e => setAuthForm({...authForm, email: e.target.value})} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown" required />
                                </div>
                            )}
                            <div>
                                <label className="block text-xs font-bold text-gray-700 mb-1">Password</label>
                                <input type="password" value={authForm.password} onChange={e => setAuthForm({...authForm, password: e.target.value})} className="w-full border border-beige rounded p-2 text-xs bg-cream text-darkbrown" required />
                            </div>

                            {view === 'signup' && (
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 mb-2">{t.selectYourAllergens}</label>
                                    <div className="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto p-1 border border-beige rounded">
                                        {COMMON_ALLERGENS.map(al => {
                                            const isChecked = authForm.selectedAllergens.includes(al);
                                            return (
                                                <label key={al} className={`flex items-center gap-2 p-1.5 rounded cursor-pointer text-xs ${isChecked ? 'bg-burgundy/10 border border-burgundy font-bold text-burgundy' : 'bg-cream text-darkbrown'}`}>
                                                    <input type="checkbox" checked={isChecked} onChange={() => toggleSignupAllergen(al)} />
                                                    {translateAllergen(al, lang)}
                                                </label>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            <button type="submit" className="w-full bg-burgundy text-cream font-bold py-2.5 rounded text-xs hover:bg-burgundy-dark transition">
                                {view === 'signup' ? t.signup : t.login}
                            </button>
                        </form>
                        
                        {view !== 'admin-login' && (
                            <div className="mt-4 text-center text-xs">
                                <button onClick={() => switchView('admin-login')} className="text-gray-500 hover:text-burgundy underline">Login as Admin</button>
                            </div>
                        )}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col bg-cream">
                    {renderHeader()}
                    {view === 'home' && renderHome()}
                    {view === 'cafeterias' && renderCafeteriasView()}
                    {view === 'todays-menu' && renderTodaysMenuView()}
                    {view === 'weekly-menu' && renderWeeklyMenuView()}
                    {view === 'profile' && renderProfileView()}
                    {view === 'admin-dashboard' && renderAdminDashboard()}
                    {(view === 'login' || view === 'signup' || view === 'admin-login') && renderAuth()}
                    {renderDishModal()}
                    <footer className="bg-darkbrown text-cream/70 text-center py-4 text-xs mt-auto">
                        <p>© 2026 Korea University Meal Guide. All rights reserved.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
