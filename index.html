        const useAutoTranslate = (text, targetLang) => {
            const [translatedText, setTranslatedText] = useState(text);

            useEffect(() => {
                if (!text || targetLang === 'en') {
                    setTranslatedText(text);
                    return;
                }

                let isMounted = true;
                const fetchTranslation = async () => {
                    try {
                        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`;
                        const res = await fetch(url);
                        const data = await res.json();
                        if (isMounted && data && data.responseData && data.responseData.translatedText) {
                            if (!data.responseData.translatedText.includes('MYMEMORY WARNING')) {
                                setTranslatedText(data.responseData.translatedText);
                            }
                        }
                    } catch (e) {
                        console.error('Translation error:', e);
                    }
                };

                fetchTranslation();
                return () => { isMounted = false; };
            }, [text, targetLang]);

            return translatedText;
        };

        const getSafeDateString = (dateInput) => {
            if (!dateInput) return new Date().toISOString().split('T')[0];
            const clean = String(dateInput).replace(/\./g, '-').trim();
            const parts = clean.split('-');
            if (parts.length === 3) {
                const y = parts[0];
                const m = parts[1].padStart(2, '0');
                const d = parts[2].padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
            return clean;
        };

        const getDayName = (dateStr) => {
            const safe = getSafeDateString(dateStr);
            const [y, m, d] = safe.split('-').map(Number);
            if (!y || !m || !d) return '';
            const dateObj = new Date(y, m - 1, d);
            return isNaN(dateObj.getTime()) ? '' : dateObj.toLocaleDateString('en-US', { weekday: 'long' });
        };

        const getCurrWeekDates = () => {
            const now = new Date();
            const currentDayOfWeek = now.getDay();
            const monday = new Date(now);
            monday.setDate(now.getDate() - (currentDayOfWeek === 0 ? 6 : currentDayOfWeek - 1));
            
            const week = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                week.push({
                    dateStr: d.toISOString().split('T')[0],
                    name: d.toLocaleDateString('en-US', { weekday: 'short' }),
                    dayNum: d.getDate()
                });
            }
            return week;
        };

                        allergens: exists
                            ? current.filter(a => a.toLowerCase() !== item.toLowerCase())
                            : [...current, item]
                    };
                });
            };

            const handleUpdateProfile = async (e) => {
                e.preventDefault();
                const baseCommon = (studentProfile.allergens || []).filter(
                    a => COMMON_ALLERGENS.some(ca => ca.toLowerCase() === a.toLowerCase())
                );
                const customList = profileOtherAllergen
                    ? profileOtherAllergen.split(',').map(s => s.trim()).filter(Boolean)
                    : [];
                const mergedAllergens = Array.from(new Set([...baseCommon, ...customList]));

                const updatedProfile = { ...studentProfile, allergens: mergedAllergens };
                const updatedUser = { ...user, profile: updatedProfile };
                
                const { error } = await supabase
                    .from('users')
                    .update({ profile: updatedProfile })
                    .eq('username', user.username);

                if (error) {
                    alert('Error updating profile: ' + error.message);
                } else {
                    setStudentProfile(updatedProfile);
                    setUser(updatedUser);
                    alert('Profile and allergies updated successfully!');
                }
            };

            const handleRateDish = async (dishId, stars) => {
                if (!user || user.role === 'admin') {
                    alert('Please log in as a student to rate dishes.');
                    return;
                }
                
                const existingRating = ratings.find(r => r.dish_id === dishId && r.username === user.username);
                
                if (existingRating) {
                    const { error } = await supabase
                        .from('ratings')
                        .update({ rating: stars })
                        .eq('id', existingRating.id);

                    if (error) {
                        alert('Error updating rating: ' + error.message);
                    } else {
                        setRatings(ratings.map(r => r.id === existingRating.id ? { ...r, rating: stars } : r));
                    }
                } else {
                    const newRecord = { dish_id: dishId, username: user.username, rating: stars };
                    const { data, error } = await supabase.from('ratings').insert([newRecord]).select();

                    if (error) {
                        alert('Error saving rating: ' + error.message);
                    } else if (data) {
                        setRatings([...ratings, data[0]]);
                    }
                }
            };

            const getDishRatingStats = (dishId) => {
                const dishRatings = ratings.filter(r => r.dish_id === dishId);
                if (dishRatings.length === 0) return { avg: 0, count: 0 };
                const sum = dishRatings.reduce((acc, r) => acc + r.rating, 0);
                return { avg: (sum / dishRatings.length).toFixed(1), count: dishRatings.length };
            };

            const getUserDishRating = (dishId) => {
                if (!user) return 0;
                const found = ratings.find(r => r.dish_id === dishId && r.username === user.username);
                return found ? found.rating : 0;
            };

            const handleAddDish = async (e) => {
                e.preventDefault();
                if (!adminForm.koName || !adminForm.enName || !adminForm.price) {
                    alert('Fill in Korean name, English name, and Price.');
                    return;
                }
                const newDish = {
                    id: 'dish_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
                    ...adminForm,
                    price: Number(adminForm.price),
                    allergens: adminForm.allergens ? adminForm.allergens.split(',').map(s => s.trim().toLowerCase()) : [],
                    published: true
                };

                const { error } = await supabase.from('dishes').insert([newDish]);
                if (error) {
                    alert('Error saving to cloud: ' + error.message);
                } else {
                    setDishes([...dishes, newDish]);
                    alert('Menu item published and saved to cloud!');
                    setAdminForm({ ...adminForm, koName: '', enName: '', price: '', desc: '', ingredients: '', allergens: '' });
                }
            };

            const handleBulkImport = async (e) => {
                e.preventDefault();
                if (!bulkText.trim()) {
                    alert('Please enter text to parse.');
                    return;
                }

                const lines = bulkText.split('\n');
                const newDishes = [];

                for (let line of lines) {
                    if (!line.trim()) continue;
                    const parts = line.split('|').map(p => p.trim());
                    if (parts.length >= 6) {
                        newDishes.push({
                            id: 'dish_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
                            date: getSafeDateString(parts[0]),
                            cafeteriaId: parts[1],
                            mealType: parts[2],
                            koName: parts[3],
                            enName: parts[4],
                            price: Number(parts[5]) || 5000,
                            desc: parts[6] || '',
                            ingredients: parts[7] || '',
                            allergens: parts[8] ? parts[8].split(',').map(s => s.trim().toLowerCase()) : [],
                            published: true
                        });
                    }
                }

                if (newDishes.length === 0) {
                    alert('No valid rows found. Format: Date | CafId | Meal | KoName | EnName | Price | Desc | Ingredients | Allergens');
                    return;
                }

                const { error } = await supabase.from('dishes').insert(newDishes);
                if (error) {
                    alert('Error bulk uploading: ' + error.message);
                } else {
                    setDishes([...dishes, ...newDishes]);
                    alert(`Successfully parsed and uploaded ${newDishes.length} dishes to cloud!`);
                    setBulkText('');
                }
            };

            const handleDeleteDish = async (id) => {
                if (confirm('Are you sure you want to delete this menu item?')) {
                    const { error } = await supabase.from('dishes').delete().eq('id', id);
                    if (error) alert('Error deleting: ' + error.message);
                    else setDishes(dishes.filter(d => d.id !== id));
                }
            };

            const handleClearAllDishes = async () => {
                if (confirm('Are you sure you want to delete ALL published menus?')) {
                    const { error } = await supabase.from('dishes').delete().neq('id', '');
                    if (error) alert('Error: ' + error.message);
                    else setDishes([]);
                }
            };

            const todayStr = new Date().toISOString().split('T')[0];

            const getMatchingUserAllergens = (dishAllergens) => {
                if (!user || !user.profile || !user.profile.allergens || !Array.isArray(dishAllergens)) return [];
                const userAllergensLower = user.profile.allergens.map(al => al.trim().toLowerCase());
                return dishAllergens.filter(a => {
                    const dishAl = a.trim().toLowerCase();
                    return userAllergensLower.some(uAl => uAl.includes(dishAl) || dishAl.includes(uAl));
                });
            };

            const checkAllergy = (dishAllergens) => getMatchingUserAllergens(dishAllergens).length > 0;

            const matchesDishFilters = (dish, { includeDay = true } = {}) => {
                if (includeDay && dayFilter !== 'all') {
                    if (getDayName(dish.date) !== dayFilter) return false;
                }
                if (mealFilter !== 'all') {
                    if ((dish.mealType || '').toLowerCase() !== mealFilter.toLowerCase()) return false;
                }
                if (allergenFilter !== 'all') {
                    const dishAllergens = Array.isArray(dish.allergens) ? dish.allergens.map(a => a.toLowerCase()) : [];
                    if (allergenFilter === 'safe_for_me') {
                        if (checkAllergy(dish.allergens)) return false;
                    } else if (allergenFilter.startsWith('exclude:')) {
                        const target = allergenFilter.replace('exclude:', '').toLowerCase();
                        if (dishAllergens.some(a => a.includes(target) || target.includes(a))) return false;
                    }
                }
                return true;
            };

            const resetFilters = () => {
                setWeeklyCafFilter('all');
                setDayFilter('all');
                setMealFilter('all');
                setAllergenFilter('all');

            const selectedCafeteriaObj = INITIAL_CAFETERIAS.find(c => c.id === selectedCafeteriaId);
            const weekDates = getCurrWeekDates();

            return (
                <div className="flex flex-col min-h-screen">
                    <header className="bg-burgundy text-white shadow-md sticky top-0 z-40">

                            <div className="flex items-center gap-4">
                                <div className="cursor-pointer font-bold text-lg" onClick={() => switchView('home')}>
                                    {t.brand}
                                </div>
                                <div className="flex bg-burgundy-dark border border-beige/30 rounded text-xs overflow-hidden">
                                    <button onClick={() => setLang('en')} className={`px-2 py-1 ${lang === 'en' ? 'bg-gold text-darkbrown font-bold' : 'text-white'}`}>EN</button>
                                    <button onClick={() => setLang('ru')} className={`px-2 py-1 ${lang === 'ru' ? 'bg-gold text-darkbrown font-bold' : 'text-white'}`}>RU</button>
                                    <button onClick={() => setLang('zh')} className={`px-2 py-1 ${lang === 'zh' ? 'bg-gold text-darkbrown font-bold' : 'text-white'}`}>中文</button>
                                </div>

                                <button onClick={() => { setSelectedCafeteriaId(null); switchView('cafeterias'); }} className={`px-3 py-1 rounded transition ${view === 'cafeterias' ? 'bg-gold text-darkbrown font-bold' : 'hover:bg-burgundy-dark'}`}>{t.cafeterias}</button>
                                <button onClick={() => switchView('todays-menu')} className={`px-3 py-1 rounded transition ${view === 'todays-menu' ? 'bg-gold text-darkbrown font-bold' : 'hover:bg-burgundy-dark'}`}>{t.todaysMenu}</button>
                                <button onClick={() => switchView('weekly-menu')} className={`px-3 py-1 rounded transition ${view === 'weekly-menu' ? 'bg-gold text-darkbrown font-bold' : 'hover:bg-burgundy-dark'}`}>{t.weeklyMenu}</button>

                                    </>

                        {view === 'home' && (

                                <div className="bg-white p-6 rounded-lg shadow border border-beige text-center">
                                    <h1 className="text-2xl font-bold mb-2 text-burgundy">{t.welcomeTitle}</h1>
                                    <p className="text-gray-600 mb-4">{t.welcomeSub}</p>
                                    <div className="flex justify-center gap-3 flex-wrap">
                                        <button onClick={() => switchView('todays-menu')} className="bg-burgundy text-white px-4 py-2 rounded text-sm font-semibold">{t.viewTodays}</button>
                                        <button onClick={() => { setSelectedCafeteriaId(null); switchView('cafeterias'); }} className="bg-gold text-darkbrown px-4 py-2 rounded text-sm font-semibold">{t.viewCafes}</button>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-xl font-bold text-burgundy">{t.todaysOverview} ({todayStr})</h2>
                                        <button onClick={() => switchView('todays-menu')} className="text-xs text-burgundy font-semibold underline">{t.viewAll}</button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {INITIAL_CAFETERIAS.map(caf => {
                                            const cafDishes = dishes.filter(d => d.cafeteriaId === caf.id && getSafeDateString(d.date) === todayStr);
                                            return (
                                                <div key={caf.id} className="bg-white p-4 rounded-lg shadow border border-beige">
                                                    <h3 className="font-bold text-burgundy">{caf.name}</h3>
                                                    <p className="text-xs text-gray-500 mb-2">{caf.hours}</p>
                                                    <div className="space-y-2 mt-2">
                                                        {cafDishes.length === 0 ? (
                                                            <p className="text-sm text-gray-400 italic">{t.noDishes}</p>
                                                        ) : (
                                                            cafDishes.slice(0, 3).map(dish => {
                                                                const isAllergic = checkAllergy(dish.allergens);
                                                                const stats = getDishRatingStats(dish.id);
                                                                const mealLocalized = t[(dish.mealType || '').toLowerCase()] || dish.mealType;
                                                                return (
                                                                    <div key={dish.id} className={`p-2 rounded border text-xs flex justify-between items-center ${isAllergic ? 'bg-red-50 border-red-300' : 'border-gray-100'}`}>
                                                                        <div>
                                                                            <span className="font-semibold">{dish.koName}</span> (<TranslatedText lang="{lang}" text="{dish.enName}"/>)
                                                                            <span className="bg-beige px-1 rounded ml-1 text-burgundy font-bold">{mealLocalized}</span>
                                                                            {stats.count > 0 && <span className="ml-2 text-amber-600 font-bold">★ {stats.avg}</span>}
                                                                        </div>
                                                                        <div className="flex items-center gap-2">
                                                                            <span className="text-burgundy font-bold">{dish.price} {t.price}</span>
                                                                            <button onClick={() => setSelectedDishModal(dish)} className="bg-cream hover:bg-gold border border-beige px-2 py-0.5 rounded font-semibold">{t.details}</button>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'cafeterias' && (
                            <div className="space-y-4">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                    <h1 className="text-2xl font-bold text-burgundy">{t.cafeterias}</h1>
                                    {selectedCafeteriaObj && (
                                        <button 
                                            onClick={() => setSelectedCafeteriaId(null)} 
                                            className="text-xs bg-beige hover:bg-gold text-darkbrown font-semibold px-3 py-1.5 rounded transition"
                                        >
                                            {t.backToCafes}
                                        </button>
                                    )}
                                </div>

                                {!selectedCafeteriaObj ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {INITIAL_CAFETERIAS.map(caf => {
                                            const cafDishCount = dishes.filter(d => d.cafeteriaId === caf.id).length;
                                            return (
                                                <div 
                                                    key={caf.id} 
                                                    onClick={() => setSelectedCafeteriaId(caf.id)}
                                                    className="bg-white p-5 rounded-lg shadow border border-beige hover:border-burgundy hover:shadow-md transition cursor-pointer space-y-2 flex flex-col justify-between"
                                                >
                                                    <div className="space-y-2">
                                                        <div className="flex justify-between items-start gap-2">
                                                            <h2 className="font-bold text-lg text-burgundy">{caf.name} <span className="text-xs text-gray-500">({caf.koName})</span></h2>
                                                            <span className="text-xs bg-cream border border-beige text-burgundy font-semibold px-2 py-0.5 rounded whitespace-nowrap">
                                                                {cafDishCount} {t.itemsLabel}
                                                            </span>
                                                        </div>
                                                        <p className="text-sm text-gray-700">📍 <strong>{t.location}:</strong> {caf.location}</p>
                                                        <p className="text-sm text-gray-700">🕒 <strong>{t.hours}:</strong> {caf.hours}</p>
                                                        <p className="text-sm text-gray-700">📞 <strong>{t.phone}:</strong> {caf.phone}</p>
                                                    </div>
                                                    <div className="pt-2 border-t border-cream flex justify-end">
                                                        <span className="text-xs font-bold text-burgundy">{t.clickToViewMenu}</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="bg-white p-5 rounded-lg shadow border border-burgundy space-y-1">
                                            <h2 className="font-bold text-xl text-burgundy">{selectedCafeteriaObj.name} <span className="text-sm text-gray-500">({selectedCafeteriaObj.koName})</span></h2>
                                            <p className="text-sm text-gray-700">📍 {selectedCafeteriaObj.location}</p>
                                            <p className="text-sm text-gray-700">🕒 {selectedCafeteriaObj.hours}</p>
                                            <p className="text-sm text-gray-700">📞 {selectedCafeteriaObj.phone}</p>
                                        </div>

                                        <div className="bg-white p-3 rounded-lg shadow border border-beige flex flex-wrap items-center gap-3">
                                            <span className="text-xs font-bold text-burgundy uppercase">{t.filters}:</span>
                                            <select value={mealFilter} onChange={e => setMealFilter(e.target.value)} className="border rounded p-1.5 text-xs bg-white">
                                                <option value="all">{t.allMeals}</option>
                                                <option value="Breakfast">{t.breakfast}</option>
                                                <option value="Lunch">{t.lunch}</option>
                                                <option value="Dinner">{t.dinner}</option>
                                            </select>
                                            <select value={allergenFilter} onChange={e => setAllergenFilter(e.target.value)} className="border rounded p-1.5 text-xs bg-white">
                                                <option value="all">All Allergens (Show All)</option>
                                                {user && user.profile?.allergens?.length > 0 && (
                                                    <option value="safe_for_me">✅ Hide My Allergens</option>
                                                )}
                                                {COMMON_ALLERGENS.map(al => (
                                                    <option key={al} value={`exclude:${al}`}>Exclude {translateAllergen(al, lang)}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="space-y-4">
                                            {DAYS_OF_WEEK.map(dayName => {
                                                const dayDishes = dishes
                                                    .filter(d => d.cafeteriaId === selectedCafeteriaObj.id && getDayName(d.date) === dayName)
                                                    .filter(d => matchesDishFilters(d, { includeDay: false }))
                                                    .sort((a, b) => new Date(getSafeDateString(a.date)) - new Date(getSafeDateString(b.date)));

                                                const dayLocalized = translateDay(dayName, lang);

                                                return (
                                                    <div key={dayName} className="bg-white p-4 rounded-lg shadow border border-beige">
                                                        <h3 className="font-bold text-burgundy border-b border-beige pb-1.5 mb-3 flex justify-between items-center">
                                                            <span>{dayLocalized}</span>
                                                            <span className="text-xs font-normal text-gray-500">{dayDishes.length} {t.dishCountLabel}</span>
                                                        </h3>
                                                        {dayDishes.length === 0 ? (
                                                            <p className="text-xs text-gray-400 italic">No dishes scheduled for {dayLocalized}.</p>
                                                        ) : (
                                                            <div className="space-y-2">
                                                                {dayDishes.map(dish => {
                                                                    const isAllergic = checkAllergy(dish.allergens);
                                                                    const stats = getDishRatingStats(dish.id);
                                                                    const mealLocalized = t[(dish.mealType || '').toLowerCase()] || dish.mealType;
                                                                    return (
                                                                        <div key={dish.id} className={`p-2.5 rounded border text-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 ${isAllergic ? 'bg-red-50 border-red-300' : 'border-gray-100'}`}>
                                                                            <div>
                                                                                <div className="font-semibold">
                                                                                    {dish.koName} (<TranslatedText lang="{lang}" text="{dish.enName}"/>)
                                                                                    <span className="text-xs bg-beige px-1.5 py-0.5 rounded ml-1.5 text-burgundy font-bold">{mealLocalized}</span>
                                                                                    <span className="text-xs text-gray-400 ml-2">{getSafeDateString(dish.date)}</span>
                                                                                    {stats.count > 0 && <span className="ml-2 text-amber-600 font-bold">★ {stats.avg} ({stats.count})</span>}

                                                                                {isAllergic && (
                                                                                    <div className="text-xs text-red-600 font-bold mt-0.5">{t.warningAllergy}</div>

                                                                            </div>
                                                                            <div className="flex items-center gap-3 self-end sm:self-center">
                                                                                <span className="text-burgundy font-bold">{dish.price} {t.price}</span>
                                                                                <button 
                                                                                    onClick={() => setSelectedDishModal(dish)} 
                                                                                    className="bg-cream hover:bg-gold border border-beige text-darkbrown px-2.5 py-1 rounded text-xs font-semibold transition"
                                                                                >
                                                                                    {t.details}
                                                                                </button>
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'todays-menu' && (
                            <div className="space-y-4">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                    <h1 className="text-2xl font-bold text-burgundy">{t.todaysMenu} ({selectedQuickDate} — {translateDay(getDayName(selectedQuickDate), lang)})</h1>
                                </div>

                                <div className="bg-white p-3 rounded-lg shadow border border-beige flex items-center gap-2 overflow-x-auto">
                                    <span className="text-xs font-bold text-burgundy uppercase whitespace-nowrap">{t.weekLabel}</span>

                                        const isSelected = item.dateStr === selectedQuickDate;
                                        return (
                                            <button
                                                key={item.dateStr}
                                                onClick={() => setSelectedQuickDate(item.dateStr)}
                                                className={`px-3 py-1.5 rounded text-xs font-semibold whitespace-nowrap transition ${isSelected ? 'bg-burgundy text-white' : 'bg-cream hover:bg-beige text-darkbrown'}`}
                                            >
                                                {translateDay(item.name, lang)} {item.dayNum}
                                            </button>
                                        );
                                    })}
                                </div>

                                {user && user.profile?.allergens?.length > 0 && (
                                    <div className="bg-amber-50 border border-amber-200 p-3 rounded text-xs text-amber-800">
                                        ⚠️ Your registered allergies: <strong>{user.profile.allergens.map(a => translateAllergen(a, lang)).join(', ')}</strong>. Unsafe dishes will be highlighted.
                                    </div>
                                )}

                                <div className="bg-white p-3 rounded-lg shadow border border-beige flex flex-wrap items-center gap-3">
                                    <span className="text-xs font-bold text-burgundy uppercase">{t.filters}:</span>

                                        <option value="all">{t.allMeals}</option>
                                        <option value="Breakfast">{t.breakfast}</option>
                                        <option value="Lunch">{t.lunch}</option>
                                        <option value="Dinner">{t.dinner}</option>
                                    </select>
                                    <select value={allergenFilter} onChange={e => setAllergenFilter(e.target.value)} className="border rounded p-1.5 text-xs bg-white">
                                        <option value="all">All Allergens (Show All)</option>
                                        {user && user.profile?.allergens?.length > 0 && (

                                                        key={star} 
                                                        onClick={() => handleRateDish(selectedDishModal.id, star)}
                                                        className={`transition hover:scale-125 ${isHighlighted ? 'text-amber-500' : 'text-gray-300'}`}
                                                    >
                                                        ★
                                                    </span>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ) : null}

                                {checkAllergy(selectedDishModal.allergens) ? (
                                    <div className="bg-red-100 border border-red-400 text-red-800 p-3 rounded text-xs font-semibold">
                                        ⚠️ {t.allergyCaution} ({getMatchingUserAllergens(selectedDishModal.allergens).map(a => translateAllergen(a, lang)).join(', ')}).
                                    </div>
                                ) : user && user.role !== 'admin' ? (
                                    <div className="bg-green-50 border border-green-300 text-green-800 p-2.5 rounded text-xs font-medium">
                                        {t.safeDish}
                                    </div>
                                ) : null}

                                <button 
                                    onClick={() => setSelectedDishModal(null)} 
                                    className="w-full bg-burgundy text-white py-2 rounded font-semibold text-sm"
                                >
                                    {t.close}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App/>, document.getElementById('root'));
    </script>
</body>
</html>
